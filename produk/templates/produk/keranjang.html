{% extends 'produk/base.html' %}
{% load static %}

{% block title %}Keranjang Belanja — NexusTech{% endblock %}

{% block extra_css %}
<style>
    .page-header { padding: 48px 40px 32px; border-bottom: 1px solid var(--border); }
    .page-tag { font-size: 11px; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
    .page-title { font-size: 36px; font-weight: 700; color: var(--text-primary); }

    .keranjang-content { display: grid; grid-template-columns: 1fr 360px; gap: 32px; padding: 40px; align-items: start; }

    /* ITEM LIST */
    .item-list { display: flex; flex-direction: column; gap: 16px; }
    .item-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; gap: 20px; align-items: center; transition: border-color 0.2s; }
    .item-card:hover { border-color: var(--accent); }
    .item-img { width: 100px; height: 80px; background: var(--bg-card2); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .item-img img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
    .laptop-mini { width: 60px; }
    .laptop-screen-mini { width: 60px; height: 38px; background: var(--border); border-radius: 3px 3px 0 0; border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; }
    .laptop-screen-inner-mini { width: 46px; height: 26px; background: var(--screen-bg); border-radius: 1px; }
    .laptop-base-mini { width: 68px; height: 5px; background: var(--border); border-radius: 0 0 3px 3px; margin-left: -4px; border: 1px solid var(--border2); }

    .item-info { flex: 1; }
    .item-brand { font-size: 10px; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
    .item-name { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .item-sku { font-size: 12px; color: var(--text-muted); }
    .item-price { font-size: 18px; font-weight: 700; color: var(--accent); margin-top: 8px; }

    .item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
    .qty-control { display: flex; align-items: center; gap: 10px; }
    .qty-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card2); color: var(--text-primary); font-size: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
    .qty-num { font-size: 16px; font-weight: 700; color: var(--text-primary); min-width: 24px; text-align: center; }
    .btn-hapus { font-size: 12px; color: #ef4444; border: 1px solid #fca5a5; background: transparent; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-weight: 600; }
    .btn-hapus:hover { background: #fef2f2; }

    .empty-cart { text-align: center; padding: 80px 40px; color: var(--text-muted); }
    .empty-icon { font-size: 64px; margin-bottom: 20px; }
    .empty-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .empty-desc { font-size: 15px; color: var(--text-secondary); margin-bottom: 28px; }

    /* RINGKASAN */
    .ringkasan { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; position: sticky; top: 100px; }
    .ringkasan-title { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .ringkasan-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
    .ringkasan-label { color: var(--text-secondary); }
    .ringkasan-val { color: var(--text-primary); font-weight: 600; }
    .ringkasan-total { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .ringkasan-total-label { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .ringkasan-total-val { font-size: 22px; font-weight: 700; color: var(--accent); }
    .btn-checkout { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 20px; transition: all 0.2s; letter-spacing: 1px; }
    .btn-checkout:hover { background: var(--accent-hover); }
    .btn-wa-checkout { width: 100%; padding: 14px; background: #25d366; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.2s; text-decoration: none; display: block; text-align: center; }
    .btn-wa-checkout:hover { background: #1ebe5d; }
    .btn-lanjut { width: 100%; padding: 12px; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all 0.2s; text-decoration: none; display: block; text-align: center; }
    .btn-lanjut:hover { background: rgba(77,141,255,0.08); }

    .note { font-size: 12px; color: var(--text-muted); margin-top: 16px; text-align: center; line-height: 1.6; }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-tag">— Keranjang Belanja</div>
    <h1 class="page-title">Keranjang Saya 🛒</h1>
</div>

<div id="keranjang-app">
    <!-- Diisi oleh JavaScript -->
</div>

{% endblock %}

{% block extra_js %}
<script>
// Keranjang disimpan di localStorage
function getKeranjang() {
    return JSON.parse(localStorage.getItem('keranjang') || '[]');
}

function saveKeranjang(data) {
    localStorage.setItem('keranjang', JSON.stringify(data));
}

function formatRupiah(angka) {
    return 'Rp' + parseInt(angka).toLocaleString('id-ID');
}

function tambahItem(id, nama, merek, harga, gambar, sku) {
    let keranjang = getKeranjang();
    const idx = keranjang.findIndex(i => i.id === id);
    if (idx >= 0) {
        keranjang[idx].qty += 1;
    } else {
        keranjang.push({ id, nama, merek, harga, gambar, sku, qty: 1 });
    }
    saveKeranjang(keranjang);
    renderKeranjang();
}

function hapusItem(id) {
    let keranjang = getKeranjang().filter(i => i.id !== id);
    saveKeranjang(keranjang);
    renderKeranjang();
}

function ubahQty(id, delta) {
    let keranjang = getKeranjang();
    const idx = keranjang.findIndex(i => i.id === id);
    if (idx >= 0) {
        keranjang[idx].qty += delta;
        if (keranjang[idx].qty <= 0) keranjang.splice(idx, 1);
    }
    saveKeranjang(keranjang);
    renderKeranjang();
}

function buildPesanWA(keranjang) {
    let pesan = 'Halo, saya ingin memesan:%0A%0A';
    keranjang.forEach(item => {
        pesan += `- ${item.nama} x${item.qty} = ${formatRupiah(item.harga * item.qty)}%0A`;
    });
    const total = keranjang.reduce((s, i) => s + i.harga * i.qty, 0);
    pesan += `%0ATotal: ${formatRupiah(total)}`;
    return `https://wa.me/6281299779053?text=${pesan}`;
}

function renderKeranjang() {
    const keranjang = getKeranjang();
    const app = document.getElementById('keranjang-app');

    if (keranjang.length === 0) {
        app.innerHTML = `
        <div class="empty-cart">
            <div class="empty-icon">🛒</div>
            <div class="empty-title">Keranjang Kosong</div>
            <div class="empty-desc">Belum ada produk di keranjang kamu.</div>
            <a href="/produk/" class="btn-primary">Mulai Belanja</a>
        </div>`;
        return;
    }

    const total = keranjang.reduce((s, i) => s + i.harga * i.qty, 0);
    const totalItem = keranjang.reduce((s, i) => s + i.qty, 0);

    const itemsHTML = keranjang.map(item => `
        <div class="item-card">
            <div class="item-img">
                ${item.gambar
                    ? `<img src="${item.gambar}" alt="${item.nama}" onerror="this.style.display='none'">`
                    : `<div class="laptop-mini">
                        <div class="laptop-screen-mini"><div class="laptop-screen-inner-mini"></div></div>
                        <div class="laptop-base-mini"></div>
                       </div>`
                }
            </div>
            <div class="item-info">
                <div class="item-brand">${item.merek}</div>
                <div class="item-name">${item.nama}</div>
                <div class="item-sku">SKU: ${item.sku || '-'}</div>
                <div class="item-price">${formatRupiah(item.harga * item.qty)}</div>
            </div>
            <div class="item-actions">
                <div class="qty-control">
                    <button class="qty-btn" onclick="ubahQty(${item.id}, -1)">−</button>
                    <span class="qty-num">${item.qty}</span>
                    <button class="qty-btn" onclick="ubahQty(${item.id}, 1)">+</button>
                </div>
                <button class="btn-hapus" onclick="hapusItem(${item.id})">🗑 Hapus</button>
            </div>
        </div>
    `).join('');

    app.innerHTML = `
    <div class="keranjang-content">
        <div>
            <div class="item-list">${itemsHTML}</div>
        </div>
        <div>
            <div class="ringkasan">
                <div class="ringkasan-title">Ringkasan Pesanan</div>
                <div class="ringkasan-row">
                    <span class="ringkasan-label">Total Item</span>
                    <span class="ringkasan-val">${totalItem} produk</span>
                </div>
                <div class="ringkasan-row">
                    <span class="ringkasan-label">Subtotal</span>
                    <span class="ringkasan-val">${formatRupiah(total)}</span>
                </div>
                <div class="ringkasan-row">
                    <span class="ringkasan-label">Ongkir</span>
                    <span class="ringkasan-val">Nego via WA</span>
                </div>
                <div class="ringkasan-total">
                    <span class="ringkasan-total-label">Total</span>
                    <span class="ringkasan-total-val">${formatRupiah(total)}</span>
                </div>
                <a href="${buildPesanWA(keranjang)}" target="_blank" class="btn-wa-checkout">💬 Pesan via WhatsApp</a>
                <a href="/produk/" class="btn-lanjut">← Lanjut Belanja</a>
                <div class="note">Pemesanan dilakukan via WhatsApp.<br>Admin akan membalas dalam 1x24 jam.</div>
            </div>
        </div>
    </div>`;
}

// Render saat halaman dibuka
renderKeranjang();
</script>
{% endblock %}
